async function api(path,opts={}){
  const h={...headers(),...(opts.headers||{})};
  if(opts.body)h["Content-Type"]="application/json";
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opts,headers:h});
  const text=await r.text();
  let body=null;try{body=text?JSON.parse(text):null}catch{}
  if(!r.ok)throw new Error(body?.message||body?.hint||body?.error_description||text||("Request failed: "+r.status));
  return body;
}
async function authApi(path,body){
  const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const text=await r.text();let b=null;try{b=text?JSON.parse(text):null}catch{}

  return b;
}

function comparisonRows(){

function printCustomReport(){
  if(!customReport.rows.length){alert("Generate a custom report first.");return}
  const rows=customReport.rows.filter(t=>t.status==="approved");
  const income=rows.filter(t=>t.transaction_type==="income").reduce((a,t)=>a+Number(t.amount||0),0);
  const expense=rows.filter(t=>t.transaction_type==="expense").reduce((a,t)=>a+Number(t.amount||0),0);
  const grouped=(type)=>{let r={};rows.filter(t=>t.transaction_type===type).forEach(t=>{let k=categoryName(t.category_id);r[k]=(r[k]||0)+Number(t.amount||0)});return r};
  let h='<div class="print-report"><h1>'+esc(customReport.name||"MoneyMap report")+'</h1><div class="muted">'+esc(customReport.start)+' to '+esc(customReport.end)+'</div>';
  if(customReport.sections.summary)h+='<div class="print-grid"><div class="print-metric">Income<b>'+money(income)+'</b></div><div class="print-metric">Spending<b>'+money(expense)+'</b></div><div class="print-metric">Net cash flow<b>'+money(income-expense)+'</b></div><div class="print-metric">Approved transactions<b>'+rows.length+'</b></div></div>';
  const table=(r)=>Object.keys(r).length?'<table><tbody>'+Object.entries(r).sort((a,b)=>b[1]-a[1]).map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+money(x[1])+'</td></tr>').join("")+'</tbody></table>':'<p class="muted">No approved transactions in this range.</p>';
  if(customReport.sections.income)h+='<h2>Income</h2>'+table(grouped("income"));
  if(customReport.sections.expenses)h+='<h2>Expenses</h2>'+table(grouped("expense"));
  if(customReport.sections.categories&&!customReport.sections.expenses)h+='<h2>Spending by category</h2>'+table(grouped("expense"));
  if(customReport.sections.budget){let br=data.budgets.map(b=>{let spent=rows.filter(t=>t.transaction_type==="expense"&&t.category_id===b.category_id).reduce((a,t)=>a+Number(t.amount||0),0);return [b,spent]});h+='<h2>Budget performance</h2><table><tbody>'+br.map(x=>'<tr><td>'+esc(categoryName(x[0].category_id))+'</td><td>'+money(x[1])+' of '+money(x[0].amount)+'</td></tr>').join("")+'</tbody></table>'}
  if(customReport.sections.goals)h+='<h2>Goal progress</h2><table><tbody>'+data.goals.filter(g=>g.status!=="archived").map(g=>'<tr><td>'+esc(g.name)+'</td><td>'+money(g.current_amount)+' / '+money(g.target_amount)+'</td></tr>').join("")+'</tbody></table>';
  if(customReport.sections.accounts)h+='<h2>Account activity</h2><table><tbody>'+data.accounts.filter(a=>a.is_active!==false).map(a=>'<tr><td>'+esc(a.name)+'</td><td>'+money(Number(a.opening_balance||0)+accountMovement(a.id))+'</td></tr>').join("")+'</tbody></table>';
  if(customReport.sections.networth)h+='<h2>Net worth</h2><table><tbody>'+data.netWorth.slice(0,12).map(n=>'<tr><td>'+esc(n.snapshot_date)+'</td><td>'+money(n.net_worth)+'</td></tr>').join("")+'</tbody></table>';
  if(customReport.sections.transactions)h+='<h2>Transaction details</h2><table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Account</th><th>Category</th><th>Amount</th></tr></thead><tbody>'+customReport.rows.map(t=>'<tr><td>'+esc(t.transaction_date)+'</td><td>'+esc(t.description||"")+'</td><td>'+esc(t.transaction_type)+'</td><td>'+esc(accountName(t.account_id))+'</td><td>'+esc(categoryName(t.category_id))+'</td><td>'+money(t.amount)+'</td></tr>').join("")+'</tbody></table>';
  h+='<p class="muted print-footer">Generated by MoneyMap.</p></div>';
  let printEl=document.getElementById("printReport");
  if(!printEl){printEl=document.createElement("div");printEl.id="printReport";document.body.appendChild(printEl)}
  printEl.innerHTML=h;
  document.body.classList.add("printing-report");
  const cleanup=()=>{document.body.classList.remove("printing-report");printEl.innerHTML=""};
  window.addEventListener("afterprint",cleanup,{once:true});
  window.print();
  setTimeout(()=>{if(document.body.classList.contains("printing-report"))cleanup()},1500);
}

function csvCell(v){let s=String(v??"");return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function downloadFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function fetchAll(table){let rows=[],offset=0,limit=1000;while(true){let batch=await api(table+"?select=*&limit="+limit+"&offset="+offset);if(!Array.isArray(batch)||!batch.length)break;rows=rows.concat(batch);if(batch.length<limit)break;offset+=limit}return rows}
async function exportTransactionsCsv(){try{let rows=await fetchAll("transactions"),cols=["id","transaction_date","transaction_type","amount","currency","account_id","category_id","transfer_account_id","transfer_direction","description","notes","status","created_at","updated_at"],csv=[cols.join(",")].concat(rows.map(r=>cols.map(k=>csvCell(r[k])).join(","))).join("\n");downloadFile("moneymap-transactions-"+new Date().toISOString().slice(0,10)+".csv",csv,"text/csv;charset=utf-8");}catch(e){alert("Could not export transactions: "+e.message)}}

async function restoreBackup(file){
  try{
    if(!file) return;
    let text=await file.text(),backup=JSON.parse(text);
    let tables=["profiles","accounts","categories","transactions","budgets","goals","goal_contributions","recurring_transactions","savings_records","savings_contributions","debts","debt_payments","investments","net_worth_snapshots"];
    if(backup.app!=="MoneyMap"||backup.backup_version!==1)throw new Error("This is not a valid MoneyMap backup.");
    if(backup.user_id!==user.id)throw new Error("This backup belongs to a different MoneyMap account.");
    if(!confirm("Restore this backup into your current account? Existing records with the same IDs will be updated. New records will be added."))return;
    for(let table of tables){
      let rows=Array.isArray(backup[table])?backup[table]:[];
      if(!rows.length)continue;
      await api(table,{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(rows)});
    }
    await load();render();alert("Backup restored successfully.");
  }catch(e){alert("Could not restore backup: "+e.message)}
}

function recurringModal(id){
  let r=id?data.recurring.find(x=>x.id===id):null;
  let accounts=data.accounts.filter(a=>a.is_active!==false).map(a=>'<option value="'+a.id+'" '+(r?.account_id===a.id?"selected":"")+'>'+esc(a.name)+'</option>').join("");

  modal(id?"Edit recurring transaction":"Add recurring transaction",'<label>Type</label><select id="rt"><option value="expense" '+(r?.transaction_type==="expense"?"selected":"")+'>Expense</option><option value="income" '+(r?.transaction_type==="income"?"selected":"")+'>Income</option></select><label>Account</label><select id="ra">'+accounts+'</select><label>Category</label><select id="rc"><option value="">No category</option>'+cats+'</select><label>Amount</label><input id="rm" type="number" step="0.01" value="'+(r?.amount??"")+'"><label>Description</label><input id="rd" value="'+esc(r?.description||"")+'"><label>Frequency</label><select id="rf"><option value="weekly" '+(r?.frequency==="weekly"?"selected":"")+'>Weekly</option><option value="monthly" '+(r?.frequency==="monthly"?"selected":"")+'>Monthly</option><option value="quarterly" '+(r?.frequency==="quarterly"?"selected":"")+'>Quarterly</option><option value="yearly" '+(r?.frequency==="yearly"?"selected":"")+'>Yearly</option></select><label>Next date</label><input id="rn" type="date" value="'+(r?.next_date||new Date().toISOString().slice(0,10))+'">');

    let account=$("ra").value,frequency=$("rf").value,nextDate=$("rn").value;if(!account)throw new Error("Select an account.");if(!nextDate)throw new Error("Select the next date.");
    let payload={account_id:account,category_id:$("rc").value||null,transaction_type:$("rt").value,amount,description:$("rd").value.trim(),frequency,next_date:nextDate,active:true};
    if(id)await api("recurring_transactions?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(payload)});
    else{payload.user_id=user.id;await api("recurring_transactions",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(payload)})}
    closeModal();await load();render();
  }catch(e){alert(e.message)}}
}
function nextRecurringDate(date,frequency){
  let d=new Date(date+"T12:00:00");
  if(frequency==="weekly")d.setDate(d.getDate()+7);
  else if(frequency==="monthly")d.setMonth(d.getMonth()+1);
  else if(frequency==="quarterly")d.setMonth(d.getMonth()+3);
  else d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}

    await api("recurring_transactions?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({next_date:nextRecurringDate(r.next_date,r.frequency)})});

}

function goalModal(id){let g=id?data.goals.find(x=>x.id===id):null;modal(id?"Edit goal":"Add goal",'<label>Name</label><input id="gn" value="'+esc(g?.name||"")+'"><label>Target amount</label><input id="ga" type="number" step="0.01" value="'+(g?.target_amount??"")+'"><label>Target date</label><input id="gd" type="date" value="'+(g?.target_date||"")+'"><label>Type</label><select id="gt"><option value="financial" '+(g?.goal_type==="financial"?"selected":"")+'>Financial</option><option value="monthly" '+(g?.goal_type==="monthly"?"selected":"")+'>Monthly</option></select>');$("save").onclick=async()=>{try{let name=$("gn").value.trim(),target=Number($("ga").value);if(!name)throw new Error("Enter a goal name.");if(!target||target<=0)throw new Error("Enter a target amount greater than zero.");let payload={name,target_amount:target,target_date:$("gd").value||null,goal_type:$("gt").value,status:g?.status==="archived"?"active":g?.status||"active"};if(id)await api("goals?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(payload)});else{payload.user_id=user.id;payload.current_amount=0;await api("goals",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(payload)})}closeModal();await load();render()}catch(e){alert(e.message)}}}
function goalContributionModal(id){let g=data.goals.find(x=>x.id===id);if(!g)return;modal("Record goal progress",'<p class="muted">This records progress separately and preserves the goal history.</p><label>Amount</label><input id="gca" type="number" step="0.01"><label>Date</label><input id="gcd" type="date" value="'+new Date().toISOString().slice(0,10)+'"><label>Notes</label><input id="gcn">');$("save").onclick=async()=>{try{let amount=Number($("gca").value),progressDate=$("gcd").value;if(!Number.isFinite(amount)||amount<=0)throw new Error("Enter a progress amount greater than zero.");if(!progressDate)throw new Error("Select a progress date.");let current=Number(g.current_amount||0),target=Number(g.target_amount||0);if(target>0&&current>=target)throw new Error("This goal has already reached its target.");if(target>0&&amount>target-current)throw new Error("Progress cannot exceed the remaining amount needed to reach the target.");let next=current+amount;await api("goal_contributions",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({goal_id:id,user_id:user.id,amount,contribution_date:progressDate,notes:$("gcn").value})});await api("goals?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({current_amount:next,status:g.target_amount&&next>=Number(g.target_amount)?"completed":"active"})});closeModal();await load();render()}catch(e){alert(e.message)}}}

function render(){root.innerHTML=user?app():auth();if(!user){$("authform").onsubmit=async e=>{e.preventDefault();$("authmsg").textContent="Signing in...";try{let s=await authApi("token?grant_type=password",{email:$("email").value,password:$("pass").value});saveSession(s);await load();render()}catch(err){$("authmsg").textContent=err.message}};$("signup").onclick=async()=>{let email=prompt("Email address");if(!email)return;let pass=prompt("Create a password");if(!pass)return;try{let s=await authApi("signup",{email,password:pass});if(s.access_token){saveSession(s);await load();render()}else alert("Account created. Check your email to confirm.")}catch(err){alert(err.message)}}}}

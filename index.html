<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoneyMap | Christy's Personal Finance Tracker</title>
<style>
:root{--bg:#faf7f2;--card:#fffdf9;--text:#292724;--muted:#817a72;--line:#e8e1d8;--terra:#c9785d;--sage:#7d9478;--soft:#f1dfd6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 12px 40px #392a1f0b}.auth .card{width:min(420px,100%)}.brand{font-weight:800;font-size:24px}.brand b{color:var(--terra)}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:var(--terra);color:#fff}.secondary{background:#f1ece5;color:var(--text)}.layout{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{padding:24px 16px;border-right:1px solid var(--line);background:#fcfaf6}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;margin:4px 0}.nav button.active,.nav button:hover{background:var(--soft)}main{padding:28px;max-width:1200px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.metric{padding:18px}.metric strong{font-size:25px;display:block;margin-top:7px}.section{margin-top:18px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#f0ece6}.progress{height:8px;background:#eee7df;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--sage)}.msg{margin-top:12px}.modal{position:fixed;inset:0;background:#29272455;display:grid;place-items:center;padding:20px;z-index:10}.modal .card{width:min(520px,100%)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid4,.grid2{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{padding:18px}.grid4,.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="root"></div><div id="modal"></div>
<script>
const SUPABASE_URL="https://mqtauhmzsjfjfcfqppdm.supabase.co";
const KEY="sb_publishable_6YyswjIgsHpsu--SMVv2bA_TTtTp3MH";
const root=document.getElementById("root"), modalEl=document.getElementById("modal");
let token=null,user=null,view="dashboard",month=new Date(),txSearch="",txType="",txAccount="",txCategory="";
let customReport={start:"",end:"",name:"Custom financial report",sections:{summary:true,income:true,expenses:true,categories:true,budget:true,goals:true,accounts:true,networth:true,transactions:false},rows:[]};
let data={accounts:[],categories:[],transactions:[],budgets:[],goals:[],recurring:[],savings:[],savingsContributions:[],debts:[],investments:[],netWorth:[],reportTransactions:[]};
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const headers=()=>({"apikey":KEY,"Authorization":"Bearer "+token,"Accept-Profile":"moneymap"});
async function api(path,opts={}){
  const h={...headers(),...(opts.headers||{})};
  if(opts.body)h["Content-Type"]="application/json";
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opts,headers:h});
  const text=await r.text();
  let body=null;try{body=text?JSON.parse(text):null}catch{}
  if(!r.ok)throw new Error(body?.message||body?.hint||body?.error_description||text||("Request failed: "+r.status));
  return body;
}
async function authApi(path,body){
  const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const text=await r.text();let b=null;try{b=text?JSON.parse(text):null}catch{}
  if(!r.ok)throw new Error(b?.msg||b?.message||b?.error_description||text||("Authentication failed: "+r.status));
  return b;
}
function monthStart(){return new Date(month.getFullYear(),month.getMonth(),1).toISOString().slice(0,10)}
function monthEnd(){return new Date(month.getFullYear(),month.getMonth()+1,0).toISOString().slice(0,10)}
function greet(){let h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Good night"}
async function load(){
  data.accounts=await api("accounts?select=*&order=created_at.desc")||[];
  data.categories=await api("categories?select=*&order=created_at.desc")||[];
  data.transactions=await api("transactions?select=*&transaction_date=gte."+monthStart()+"&transaction_date=lte."+monthEnd()+"&order=transaction_date.desc")||[];
  data.budgets=await api("budgets?select=*&period_start=gte."+monthStart()+"&period_start=lt."+new Date(month.getFullYear(),month.getMonth()+1,1).toISOString().slice(0,10))||[];
  data.goals=await api("goals?select=*&order=created_at.desc")||[];
  data.recurring=await api("recurring_transactions?select=*&order=next_date.asc")||[];
  data.savings=await api("savings_records?select=*&order=created_at.desc")||[];
  data.savingsContributions=await api("savings_contributions?select=*&order=contribution_date.desc")||[];
  data.debts=await api("debts?select=*&order=created_at.desc")||[];
  data.investments=await api("investments?select=*&order=valuation_date.desc")||[];
  data.netWorth=await api("net_worth_snapshots?select=*&order=snapshot_date.desc")||[];
  data.reportTransactions=await reportRange(3);
  data.historicalTransactions=await reportRange(12);
}
function saveSession(s){token=s.access_token;user=s.user;localStorage.setItem("moneymap_session",JSON.stringify(s))}
function clearSession(){token=null;user=null;localStorage.removeItem("moneymap_session")}
function auth(){
return '<div class="auth"><div class="card"><div class="brand">Money<b>Map</b></div><h1>Welcome back</h1><p class="muted">Your private personal finance space.</p><form id="authform"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="pass" type="password" minlength="6" required><button class="btn primary" style="width:100%;margin-top:18px">Sign in</button><div id="authmsg" class="muted msg"></div></form><button class="btn secondary" id="signup" style="width:100%;margin-top:10px">Create an account</button></div></div>';
}
function app(){
return '<div class="layout"><aside class="side"><div class="brand" style="padding:8px 12px 20px">Money<b>Map</b></div><nav class="nav">'+["dashboard","accounts","transactions","categories","budgets","goals","savings","debts","investments","networth","recurring","calendar","comparisons","reports","customreports","insights","data"].map(v=>'<button class="'+(view===v?"active":"")+'" onclick="go(&quot;'+v+'&quot;)">'+v[0].toUpperCase()+v.slice(1)+'</button>').join("")+'</nav><button class="btn secondary" style="margin:24px 12px;width:calc(100% - 24px)" onclick="logout()">Sign out</button></aside><main><div class="top"><div><div class="muted">'+greet()+'</div><h1>'+esc(user?.user_metadata?.full_name||"Christy")+'</h1></div><div><button class="btn secondary" onclick="changeMonth(-1)">‹</button> <b>'+month.toLocaleString("en-US",{month:"long",year:"numeric"})+'</b> <button class="btn secondary" onclick="changeMonth(1)">›</button></div></div>'+page()+'</main></div>';
}
function page(){if(view==="dashboard")return dashboard();if(view==="accounts")return accounts();if(view==="transactions")return transactions();if(view==="categories")return categories();if(view==="budgets")return budgets();if(view==="goals")return goals();if(view==="savings")return savings();if(view==="debts")return debts();if(view==="investments")return investments();if(view==="networth")return networth();if(view==="recurring")return recurring();if(view==="calendar")return calendarPage();if(view==="comparisons")return comparisons();if(view==="reports")return reports();if(view==="customreports")return customReports();if(view==="insights")return insightsPage();return dataPage()}
function sum(type){return data.transactions.filter(t=>t.transaction_type===type&&t.status==="approved").reduce((a,t)=>a+Number(t.amount||0),0)}
function metric(a,b){return '<section class="card metric"><span class="muted">'+a+'</span><strong>'+b+'</strong></section>'}
function accountName(id){return data.accounts.find(a=>a.id===id)?.name||"Account"}
function categoryName(id){return data.categories.find(c=>c.id===id)?.name||"Uncategorized"}
function listTx(n,list=data.transactions){if(!list.length)return '<p class="muted">No transactions match the current filters.</p>';return '<div class="list">'+list.slice(0,n).map(t=>'<div class="row"><div><b>'+esc(t.description||categoryName(t.category_id))+'</b><div class="muted">'+t.transaction_date+' · '+accountName(t.account_id)+(t.transaction_type==="transfer"?' → '+accountName(t.transfer_account_id):'')+'</div></div><div style="text-align:right"><b>'+((t.transaction_type==="expense")?"-":t.transaction_type==="transfer"?"":"+")+money(t.amount)+'</b><div style="margin-top:5px"><button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="txModal(&quot;'+t.id+'&quot;)">Edit</button> '+(t.status==="pending"?'<button class="btn primary" style="padding:5px 8px;font-size:12px" onclick="approveTx(&quot;'+t.id+'&quot;)">Approve</button> ':'')+'<button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="archiveTx(&quot;'+t.id+'&quot;)">Archive</button></div></div></div>').join("")+'</div>'}
function dashboard(){let inc=sum("income"),exp=sum("expense");return '<div class="grid4">'+metric("Income",money(inc))+metric("Spending",money(exp))+metric("Net cash flow",money(inc-exp))+metric("Transfers",money(data.transactions.filter(t=>t.transaction_type==="transfer").reduce((a,t)=>a+Number(t.amount||0),0)))+'</div><div class="grid2 section"><section class="card"><h2>Recent activity</h2>'+listTx(6)+'</section><section class="card"><h2>Budget progress</h2>'+budgetSummary()+'</section></div><section class="card section"><h2>Goals</h2>'+goalSummary()+'</section>'}
function accounts(){return '<div class="top"><div><h1>Accounts</h1><div class="muted">Your money accounts and current balances.</div></div><button class="btn primary" onclick="accountModal()">Add account</button></div><section class="card list">'+(data.accounts.length?data.accounts.map(a=>'<div class="row"><div><b>'+esc(a.name)+'</b><div class="muted">'+esc(a.account_type)+' · '+esc(a.currency)+(a.is_active===false?' · Archived':'')+'</div></div><div style="text-align:right"><b>'+money(Number(a.opening_balance)+accountMovement(a.id))+'</b><div style="margin-top:5px"><button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="accountModal(&quot;'+a.id+'&quot;)">Edit</button> <button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="toggleAccount(&quot;'+a.id+'&quot;)">'+(a.is_active===false?'Restore':'Archive')+'</button></div></div></div>').join(""):'<p class="muted">No accounts yet. Add your first account.</p>')+'</section>'}
function accountMovement(id){return data.transactions.filter(t=>t.status==="approved"&&(t.account_id===id||t.transfer_account_id===id)).reduce((a,t)=>{if(t.transaction_type==="transfer")return a+(t.account_id===id?-1:1)*Number(t.amount||0);return a+(t.transaction_type==="expense"?-1:1)*Number(t.amount||0)},0)}
function transactions(){let filtered=data.transactions.filter(t=>{let q=txSearch.toLowerCase();return (!q||String(t.description||"").toLowerCase().includes(q)||categoryName(t.category_id).toLowerCase().includes(q))&&(!txType||t.transaction_type===txType)&&(!txAccount||t.account_id===txAccount)&&(!txCategory||t.category_id===txCategory)});return '<div class="top"><h1>Transactions</h1><button class="btn primary" onclick="txModal()">Add transaction</button></div><section class="card"><div class="grid2" style="margin-bottom:16px"><div><label>Search</label><input value="'+esc(txSearch)+'" oninput="txSearch=this.value;render()"></div><div><label>Type</label><select onchange="txType=this.value;render()"><option value="">All types</option><option value="income" '+(txType==="income"?"selected":"")+'>Income</option><option value="expense" '+(txType==="expense"?"selected":"")+'>Expense</option><option value="transfer" '+(txType==="transfer"?"selected":"")+'>Transfer</option></select></div><div><label>Account</label><select onchange="txAccount=this.value;render()"><option value="">All accounts</option>'+data.accounts.map(a=>'<option value="'+a.id+'" '+(txAccount===a.id?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></div><div><label>Category</label><select onchange="txCategory=this.value;render()"><option value="">All categories</option>'+data.categories.map(a=>'<option value="'+a.id+'" '+(txCategory===a.id?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></div></div>'+listTx(100,filtered)+'</section>'}
function categories(){return '<div class="top"><div><h1>Categories</h1><div class="muted">Organize income and spending without losing history.</div></div><button class="btn primary" onclick="catModal()">Add category</button></div><div class="grid2">'+["expense","income"].map(type=>'<section class="card"><h2>'+type[0].toUpperCase()+type.slice(1)+'</h2><div class="list">'+data.categories.filter(c=>c.category_type===type).map(c=>'<div class="row"><div><span>'+esc(c.name)+'</span>'+(c.is_active===false?'<div class="muted">Archived</div>':'')+'</div><div><span class="pill">'+type+'</span> <button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="catModal(&quot;'+c.id+'&quot;)">Edit</button> <button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="toggleCategory(&quot;'+c.id+'&quot;)">'+(c.is_active===false?'Restore':'Archive')+'</button></div></div>').join("")+'</div></section>').join("")+'</div>'}
function budgets(){return '<div class="top"><h1>Budgets</h1><button class="btn primary" onclick="budgetModal()">Add budget</button></div><section class="card list">'+(data.budgets.length?data.budgets.map(b=>{let spent=data.transactions.filter(t=>t.transaction_type==="expense"&&t.status==="approved"&&t.category_id===b.category_id).reduce((a,t)=>a+Number(t.amount),0),p=Number(b.amount)?Math.min(100,spent/Number(b.amount)*100):0;return '<div><div class="row"><div><b>'+esc(categoryName(b.category_id))+'</b><div class="muted">'+money(spent)+' of '+money(b.amount)+'</div></div><b>'+Math.round(p)+'%</b></div><div class="progress"><i style="width:'+p+'%"></i></div></div>'}).join(""):'<p class="muted">No budgets for this month.</p>')+'</section>'}
function goals(){return '<div class="top"><h1>Goals</h1><button class="btn primary" onclick="goalModal()">Add goal</button></div><section class="card list">'+(data.goals.length?data.goals.map(g=>{let p=Number(g.target_amount)?Math.min(100,Number(g.current_amount)/Number(g.target_amount)*100):0;return '<div><div class="row"><div><b>'+esc(g.name)+'</b><div class="muted">'+money(g.current_amount)+' of '+money(g.target_amount)+'</div></div><b>'+Math.round(p)+'%</b></div><div class="progress"><i style="width:'+p+'%"></i></div></div>'}).join(""):'<p class="muted">No active goals yet.</p>')+'</section>'}
function savings(){
  let active=data.savings.filter(s=>s.status!=="archived");
  function pct(s){return s.target_amount?Math.min(100,Number(s.current_amount||0)/Number(s.target_amount)*100):0}
  function row(s){
    let p=pct(s), account=s.account_id?accountName(s.account_id):"No account linked";
    return '<div class="card" style="padding:20px"><div class="row" style="padding-top:0"><div><h3 style="margin:0">'+esc(s.name)+'</h3><div class="muted">'+account+(s.target_date?' · Target '+esc(s.target_date):'')+'</div></div><div><b>'+money(s.current_amount)+'</b>'+(s.target_amount?' / '+money(s.target_amount):'')+'</div></div>'+(s.target_amount?'<div class="progress"><i style="width:'+p+'%"></i></div><div class="muted" style="margin-top:7px">'+Math.round(p)+'% of target</div>':'')+'<div class="actions"><button class="btn primary" onclick="contributionModal(&quot;'+s.id+'&quot;)">Record contribution</button><button class="btn secondary" onclick="savingsModal(&quot;'+s.id+'&quot;)">Edit</button><button class="btn secondary" onclick="toggleSavings(&quot;'+s.id+'&quot;)">Archive</button></div></div>';
  }
  return '<div class="top"><div><h1>Savings</h1><div class="muted">Track savings separately from ordinary leftover cash and preserve contribution history.</div></div><button class="btn primary" onclick="savingsModal()">Add savings goal</button></div>'+(active.length?active.map(row).join(""):'<section class="card"><p class="muted">No savings goals yet. Add one to start tracking a target and its contributions.</p></section>');
}
function debts(){
  let active=data.debts||[];
  function row(d){
    let original=Number(d.original_amount||0),out=Number(d.outstanding_amount||0),paid=Math.max(0,original-out),pct=original?Math.min(100,paid/original*100):0;
    return '<div class="card" style="padding:20px"><div class="row" style="padding-top:0"><div><h3 style="margin:0">'+esc(d.name)+'</h3><div class="muted">Monthly payment '+money(d.monthly_payment||0)+'</div></div><div><b>'+money(out)+'</b><div class="muted">Outstanding</div></div></div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="muted" style="margin-top:7px">'+Math.round(pct)+'% paid down</div><div class="actions"><button class="btn primary" onclick="debtPaymentModal(&quot;'+d.id+'&quot;)">Record payment</button><button class="btn secondary" onclick="debtModal(&quot;'+d.id+'&quot;)">Edit</button></div></div>';
  }
  return '<div class="top"><div><h1>Debts</h1><div class="muted">Track outstanding balances and preserve payment history.</div></div><button class="btn primary" onclick="debtModal()">Add debt</button></div>'+(active.length?active.map(row).join(""):'<section class="card"><p class="muted">No debts recorded yet.</p></section>');
}
function investments(){
  let rows=data.investments||[];
  function row(i){
    let invested=Number(i.invested_amount||0),value=Number(i.current_value||0),gain=value-invested,pct=invested?gain/invested*100:0;
    return '<div class="row"><div><b>'+esc(i.name)+'</b><div class="muted">'+esc(i.investment_type||"Investment")+' · Valued '+esc(i.valuation_date||"")+'</div></div><div style="text-align:right"><b>'+money(value)+'</b><div class="muted">Invested '+money(invested)+' · '+(gain>=0?"+":"")+money(gain)+' ('+pct.toFixed(1)+'%)</div><div style="margin-top:5px"><button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="investmentModal(&quot;'+i.id+'&quot;)">Edit</button></div></div></div>';
  }
  let totalInvested=rows.reduce((a,i)=>a+Number(i.invested_amount||0),0),totalValue=rows.reduce((a,i)=>a+Number(i.current_value||0),0);
  return '<div class="top"><div><h1>Investments</h1><div class="muted">Track invested capital and current valuations without a live market data service.</div></div><button class="btn primary" onclick="investmentModal()">Add investment</button></div><div class="grid2"><section class="card metric"><span class="muted">Invested</span><strong>'+money(totalInvested)+'</strong></section><section class="card metric"><span class="muted">Current value</span><strong>'+money(totalValue)+'</strong></section></div><section class="card section"><div class="list">'+(rows.length?rows.map(row).join(""):'<p class="muted">No investments recorded yet.</p>')+'</div></section>';
}
function networth(){
  let rows=[...(data.netWorth||[])].sort((a,b)=>String(b.snapshot_date).localeCompare(String(a.snapshot_date)));
  let latest=rows[0];
  let assets=latest?Number(latest.assets||0):0,liabilities=latest?Number(latest.liabilities||0):0;
  let derived=assets-liabilities;
  let accountAssets=data.accounts.reduce((a,x)=>a+Number(x.opening_balance||0)+accountMovement(x.id),0);
  let investmentAssets=data.investments.reduce((a,x)=>a+Number(x.current_value||0),0);
  let debtLiabilities=data.debts.reduce((a,x)=>a+Number(x.outstanding_amount||0),0);
  return '<div class="top"><div><h1>Net worth</h1><div class="muted">Monthly snapshots preserve your financial position over time.</div></div><button class="btn primary" onclick="netWorthModal()">Add snapshot</button></div><div class="grid4">'+metric("Current account assets",money(accountAssets))+metric("Investments",money(investmentAssets))+metric("Debt liabilities",money(debtLiabilities))+metric("Latest snapshot",money(derived))+'</div><section class="card section"><h2>Net worth history</h2><div class="list">'+(rows.length?rows.map(r=>'<div class="row"><div><b>'+esc(r.snapshot_date)+'</b><div class="muted">Assets '+money(r.assets)+' · Liabilities '+money(r.liabilities)+'</div></div><b>'+money(r.net_worth)+'</b></div>').join(""):'<p class="muted">No net worth snapshots yet.</p>')+'</div></section>';
}
function recurring(){
  let active=data.recurring.filter(r=>r.active!==false);
  let inactive=data.recurring.filter(r=>r.active===false);
  function row(r){
    let account=accountName(r.account_id),category=categoryName(r.category_id);
    return '<div class="row"><div><b>'+esc(r.description||category)+'</b><div class="muted">'+esc(r.frequency)+' · '+account+(category&&r.transaction_type!=="transfer"?' · '+category:'')+' · Next '+esc(r.next_date)+'</div></div><div style="text-align:right"><b>'+money(r.amount)+'</b><div style="margin-top:5px"><button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="recurringModal(&quot;'+r.id+'&quot;)">Edit</button> <button class="btn primary" style="padding:5px 8px;font-size:12px" onclick="createPendingFromRecurring(&quot;'+r.id+'&quot;)">Create pending</button> <button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="toggleRecurring(&quot;'+r.id+'&quot;)">Pause</button></div></div></div>';
  }
  function pausedRow(r){
    return '<div class="row"><div><b>'+esc(r.description||categoryName(r.category_id))+'</b><div class="muted">'+esc(r.frequency)+' · Paused</div></div><button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="toggleRecurring(&quot;'+r.id+'&quot;)">Resume</button></div>';
  }

  modal(id?"Edit recurring transaction":"Add recurring transaction",'<label>Type</label><select id="rt"><option value="expense" '+(r?.transaction_type==="expense"?"selected":"")+'>Expense</option><option value="income" '+(r?.transaction_type==="income"?"selected":"")+'>Income</option></select><label>Account</label><select id="ra">'+accounts+'</select><label>Category</label><select id="rc"><option value="">No category</option>'+cats+'</select><label>Amount</label><input id="rm" type="number" step="0.01" value="'+(r?.amount??"")+'"><label>Description</label><input id="rd" value="'+esc(r?.description||"")+'"><label>Frequency</label><select id="rf"><option value="weekly" '+(r?.frequency==="weekly"?"selected":"")+'>Weekly</option><option value="monthly" '+(r?.frequency==="monthly"?"selected":"")+'>Monthly</option><option value="quarterly" '+(r?.frequency==="quarterly"?"selected":"")+'>Quarterly</option><option value="yearly" '+(r?.frequency==="yearly"?"selected":"")+'>Yearly</option></select><label>Next date</label><input id="rn" type="date" value="'+(r?.next_date||new Date().toISOString().slice(0,10))+'">');
  $("save").onclick=async()=>{try{
    let amount=Number($("rm").value); if(!amount||amount<=0)throw new Error("Enter an amount greater than zero.");
    let payload={account_id:$("ra").value,category_id:$("rc").value||null,transaction_type:$("rt").value,amount,description:$("rd").value,frequency:$("rf").value,next_date:$("rn").value,active:true};
    if(id)await api("recurring_transactions?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(payload)});
    else{payload.user_id=user.id;await api("recurring_transactions",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(payload)})}
    closeModal();await load();render();
  }catch(e){alert(e.message)}}
}
function nextRecurringDate(date,frequency){
  let d=new Date(date+"T12:00:00");
  if(frequency==="weekly")d.setDate(d.getDate()+7);
  else if(frequency==="monthly")d.setMonth(d.getMonth()+1);
  else if(frequency==="quarterly")d.setMonth(d.getMonth()+3);
  else d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}
async function createPendingFromRecurring(id){
  let r=data.recurring.find(x=>x.id===id); if(!r)return;
  try{
    await api("transactions",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({user_id:user.id,account_id:r.account_id,category_id:r.category_id,transaction_type:r.transaction_type,amount:r.amount,currency:"NGN",transaction_date:r.next_date,description:r.description||"Recurring transaction",status:"pending",transfer_direction:null})});
    await api("recurring_transactions?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({next_date:nextRecurringDate(r.next_date,r.frequency)})});
    await load();render();
  }catch(e){alert(e.message)}
}
async function toggleRecurring(id){
  let r=data.recurring.find(x=>x.id===id);if(!r)return;
  try{await api("recurring_transactions?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({active:r.active===false})});await load();render()}catch(e){alert(e.message)}
}
function budgetModal(){let cats=data.categories.filter(c=>c.category_type==="expense").map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("");modal("Add budget",'<label>Category</label><select id="bc">'+cats+'</select><label>Amount</label><input id="ba" type="number" step="0.01"><label>Month</label><input id="bm" type="month" value="'+monthStart().slice(0,7)+'">');$("save").onclick=async()=>{try{await api("budgets",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({user_id:user.id,category_id:$("bc").value,period_start:$("bm").value+"-01",amount:Number($("ba").value)})});closeModal();await load();render()}catch(e){alert(e.message)}}}
function goalModal(){modal("Add goal",'<label>Name</label><input id="gn"><label>Target amount</label><input id="ga" type="number"><label>Target date</label><input id="gd" type="date"><label>Type</label><select id="gt"><option value="financial">Financial</option><option value="monthly">Monthly</option></select>');$("save").onclick=async()=>{try{await api("goals",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({user_id:user.id,name:$("gn").value,target_amount:Number($("ga").value),current_amount:0,target_date:$("gd").value||null,goal_type:$("gt").value,status:"active"})});closeModal();await load();render()}catch(e){alert(e.message)}}}
function go(v){view=v;render()}
async function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);try{await load();render()}catch(e){alert(e.message)}}
async function logout(){clearSession();render()}
function render(){root.innerHTML=user?app():auth();if(!user){$("authform").onsubmit=async e=>{e.preventDefault();$("authmsg").textContent="Signing in...";try{let s=await authApi("token?grant_type=password",{email:$("email").value,password:$("pass").value});saveSession(s);await load();render()}catch(err){$("authmsg").textContent=err.message}};$("signup").onclick=async()=>{let email=prompt("Email address");if(!email)return;let pass=prompt("Create a password");if(!pass)return;try{let s=await authApi("signup",{email,password:pass});if(s.access_token){saveSession(s);await load();render()}else alert("Account created. Check your email to confirm.")}catch(err){alert(err.message)}}}}
async function start(){let saved=localStorage.getItem("moneymap_session");if(saved){try{let s=JSON.parse(saved);token=s.access_token;user=s.user;await load();render();return}catch(e){clearSession()}}render()}
start().catch(e=>{root.innerHTML='<div class="auth"><div class="card"><div class="brand">Money<b>Map</b></div><h1>MoneyMap could not start</h1><p class="muted">'+esc(e.message)+'</p><button class="btn secondary" onclick="location.reload()">Reload</button></div></div>'});
</script>
